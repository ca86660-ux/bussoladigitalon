<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bússola Digital - Projeto de Ensino</title>
    
    <!-- Importa o React e o ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Importa o Babel para ler o código JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Importa o Tailwind CSS para o design visual -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Otimizações para toque em dispositivos móveis */
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .carto-grid {
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .carto-grid-dark {
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
</head>
<body class="bg-slate-900 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        function App() {
            // --- ESTADO GLOBAL ---
            const [currentScreen, setCurrentScreen] = useState('map'); 
            const [stars, setStars] = useState(0);
            const [level, setLevel] = useState(1);
            const [achievements, setAchievements] = useState([]);
            
            // Acessibilidade
            const [dyslexicFont, setDyslexicFont] = useState(false);
            const [soundEnabled, setSoundEnabled] = useState(true);
            const [highContrast, setHighContrast] = useState(false);
            const [showSettings, setShowSettings] = useState(false);

            // Estados de Missão Padrão
            const [feedback, setFeedback] = useState(null); 
            const [instruction, setInstruction] = useState('');
            const [expectedAnswer, setExpectedAnswer] = useState('');
            const [missionProgress, setMissionProgress] = useState(0);
            const [missionTotalSteps, setMissionTotalSteps] = useState(5);
            const [missionComplete, setMissionComplete] = useState(false);
            const [shields, setShields] = useState(3);

            // --- ESTADOS DE GPS E SENSORES ---
            const [realHeading, setRealHeading] = useState(0);
            const [headingOffset, setHeadingOffset] = useState(0);
            const [location, setLocation] = useState(null);
            const [sensorStatus, setSensorStatus] = useState('idle');
            const [targetHeading, setTargetHeading] = useState(0); 
            const hasAbsoluteRef = React.useRef(false);

            // --- FUNÇÕES DE CARTOGRAFIA E SENSORES ---
            const formatCoord = (decimal, isLat) => {
                if (!decimal) return '--';
                const dir = decimal < 0 ? (isLat ? 'S' : 'O') : (isLat ? 'N' : 'L');
                const abs = Math.abs(decimal);
                const deg = Math.floor(abs);
                const minFloat = (abs - deg) * 60;
                const min = Math.floor(minFloat);
                const sec = Math.round((minFloat - min) * 60);
                return `${deg}° ${min}' ${sec}" ${dir}`;
            };

            const startRealSensors = async () => {
                playSound('click');
                setSensorStatus('requesting');
                hasAbsoluteRef.current = false;

                if ("geolocation" in navigator) {
                    navigator.geolocation.watchPosition(
                        (pos) => setLocation({ 
                            lat: pos.coords.latitude, 
                            lng: pos.coords.longitude,
                            accuracy: Math.round(pos.coords.accuracy || 0)
                        }),
                        (err) => {
                            console.warn("GPS Erro:", err);
                            setSensorStatus('error');
                        },
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
                    );
                } else {
                    setSensorStatus('error');
                }
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                            setSensorStatus('active');
                        } else {
                            setSensorStatus('error');
                        }
                    } catch (error) { setSensorStatus('error'); }
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation);
                    window.addEventListener('deviceorientation', handleOrientation);
                    setSensorStatus('active');
                }
                setTimeout(() => setSensorStatus(prev => prev === 'requesting' ? 'error' : prev), 3000);
            };

            const handleOrientation = (event) => {
                let rawHeading = null;
                // 1. Bússola nativa iOS (já aponta para o Norte magnético)
                if (typeof event.webkitCompassHeading === 'number' && !isNaN(event.webkitCompassHeading)) {
                    rawHeading = event.webkitCompassHeading;
                    hasAbsoluteRef.current = true;
                } 
                // 2. Android Norte Absoluto (prioritário)
                else if (event.type === 'deviceorientationabsolute' || event.absolute === true) {
                    if (typeof event.alpha === 'number') {
                        rawHeading = (360 - event.alpha) % 360;
                        hasAbsoluteRef.current = true;
                    }
                }
                // 3. Fallback relativo apenas se o aparelho não tiver sensor absoluto
                else if (!hasAbsoluteRef.current && typeof event.alpha === 'number') {
                    rawHeading = (360 - event.alpha) % 360;
                }

                if (rawHeading !== null) {
                    setRealHeading(prev => {
                        // Suavização circular para evitar que a agulha fique tremendo
                        let diff = ((rawHeading - prev + 540) % 360) - 180;
                        return (prev + diff * 0.25 + 360) % 360;
                    });
                    setSensorStatus('active');
                }
            };

            const calibrateNorth = () => {
                playSound('click');
                // Define a direção atual do aparelho como Norte (0°) caso o sensor esteja desalinhado
                setHeadingOffset(prev => (prev - realHeading + 360) % 360);
            };

            const stopSensors = () => {
                window.removeEventListener('deviceorientation', handleOrientation);
                window.removeEventListener('deviceorientationabsolute', handleOrientation);
                hasAbsoluteRef.current = false;
                setSensorStatus('idle');
            };

            const goHome = () => {
                playSound('click');
                stopSensors();
                setMissionComplete(false); 
                setFeedback(null);
                setCurrentScreen('map');
            };

            // --- LÓGICA DE SOM E GAMIFICAÇÃO ---
            const playSound = (type) => {
                if (!soundEnabled) return;
                
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!window.audioCtx) window.audioCtx = new AudioContext();
                    const ctx = window.audioCtx;
                    if (ctx.state === 'suspended') ctx.resume();

                    // Recurso de Voz para Acessibilidade (Dislexia)
                    if (type === 'voice') {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(instruction);
                        utterance.lang = 'pt-BR';
                        utterance.rate = 0.92;
                        window.speechSynthesis.speak(utterance);
                        return;
                    }

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    if (type === 'click') {
                        // Som tátil suave e moderno de clique
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(650, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(280, ctx.currentTime + 0.045);
                        gain.gain.setValueAtTime(0.18, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.045);
                    } else if (type === 'success') {
                        // Acorde feliz ascendente
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // Dó
                        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // Mi
                        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // Sol
                        gain.gain.setValueAtTime(0.22, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.4);
                    } else if (type === 'shield_lost') {
                        // Som grave de alerta ao perder escudo
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, ctx.currentTime);
                        osc.frequency.linearRampToValueAtTime(140, ctx.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.2, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                        osc.start();
                        osc.stop(ctx.currentTime + 0.3);
                    }
                } catch (e) {
                    console.warn('Áudio não suportado neste navegador:', e);
                }
            };

            const calibratedHeading = (realHeading + headingOffset + 360) % 360;

            const getHeadingDiff = () => {
                let diff = Math.abs(calibratedHeading - targetHeading);
                if (diff > 180) diff = 360 - diff; 
                return diff;
            };

            const adjustManualHeading = (delta) => {
                playSound('click');
                setRealHeading(prev => (prev + delta + 360) % 360);
            };

            const checkHeading = () => {
                playSound('click');
                const diff = getHeadingDiff();
                if (diff <= 15) { 
                    triggerFeedback(true, '', generateMission4Task);
                } else {
                    triggerFeedback(false, `Fora de alcance! Você está em ${Math.round(calibratedHeading)}°, mas o alvo está em ${targetHeading}°.`);
                }
            };

            const handleMissionSuccess = (autoAdvanceFn) => {
                playSound('success');
                const newProgress = missionProgress + 1;
                setMissionProgress(newProgress);
                
                if (newProgress >= missionTotalSteps) {
                    const bonus = shields * 15;
                    setStars(prev => prev + 60 + bonus);
                    setLevel(prev => Math.floor((stars + 60 + bonus) / 100) + 1);
                    setFeedback({ type: 'success', message: `Missão Concluída! +${60 + bonus} Estrelas` });
                    
                    setTimeout(() => {
                        setFeedback(null);
                        setMissionComplete(true);
                        if (!achievements.find(a => a.id === currentScreen)) {
                            let icon = '⭐';
                            let title = 'Explorador';
                            if(currentScreen === 'mission1') { icon = '🪞'; title = 'Mestre do Espelho'; }
                            if(currentScreen === 'mission2') { icon = '🧭'; title = 'Rosa dos Ventos'; }
                            if(currentScreen === 'mission3') { icon = '⛰️'; title = 'Navegador Ágil'; }
                            if(currentScreen === 'mission4') { icon = '🛰️'; title = 'Caçador GPS'; }
                            if(currentScreen === 'mission5') { icon = '🌍'; title = 'Cartógrafo Global'; }
                            setAchievements(prev => [...prev, { id: currentScreen, title, icon }]);
                        }
                    }, 1400);
                } else {
                    setStars(prev => prev + 15);
                    setLevel(prev => Math.floor((stars + 15) / 100) + 1);
                    setFeedback({ type: 'success', message: 'Excelente! +15 Estrelas' });
                    setTimeout(() => {
                        setFeedback(null);
                        if(autoAdvanceFn) autoAdvanceFn();
                    }, 1100);
                }
            };

            const triggerFeedback = (isCorrect, customErrorMessage, autoAdvanceFn) => {
                if (isCorrect) {
                    handleMissionSuccess(autoAdvanceFn);
                } else {
                    playSound('shield_lost');
                    setShields(prev => Math.max(0, prev - 1));
                    
                    if (shields <= 1) {
                        setFeedback({ type: 'error', message: 'Escudos esgotados! Respire fundo e tente novamente.' });
                        setTimeout(() => {
                            setFeedback(null);
                            goHome();
                        }, 2600);
                    } else {
                        setFeedback({ type: 'error', message: customErrorMessage });
                        setTimeout(() => setFeedback(null), 2600); 
                    }
                }
            };

            // --- MISSÃO 1: LATERALIDADE + DESCENTRAÇÃO ESPACIAL (ESPELHO) ---
            const [isMirrored, setIsMirrored] = useState(false);

            const startMission1 = () => {
                playSound('click');
                setMissionProgress(0); setMissionTotalSteps(6); setMissionComplete(false); setShields(3);
                generateMission1Task(); setCurrentScreen('mission1');
            };
            const generateMission1Task = useCallback(() => {
                const mirrored = Math.random() > 0.45; // 55% de chance de ser perspectiva espelhada!
                const isRight = Math.random() > 0.5;
                setIsMirrored(mirrored);

                if (!mirrored) {
                    setInstruction(isRight ? 'SUA perspectiva: Toque na DIREITA' : 'SUA perspectiva: Toque na ESQUERDA');
                    setExpectedAnswer(isRight ? 'right' : 'left');
                } else {
                    // O astronauta está de frente para o aluno (inverte na tela!)
                    setInstruction(isRight ? 'O Astronauta está DE FRENTE! Qual é a mão DIREITA dele?' : 'O Astronauta está DE FRENTE! Qual é a mão ESQUERDA dele?');
                    // A mão direita de quem está de frente fica à ESQUERDA da tela
                    setExpectedAnswer(isRight ? 'left' : 'right');
                }
            }, []);

            // --- MISSÃO 2: BÚSSOLA 8 PONTOS COM ROTAÇÃO ---
            const [roseAngle, setRoseAngle] = useState(0);

            const startMission2 = () => {
                playSound('click');
                setMissionProgress(0); setMissionTotalSteps(6); setMissionComplete(false); setShields(3);
                generateMission2Task(); setCurrentScreen('mission2');
            };
            const generateMission2Task = useCallback(() => {
                const points = [
                    { id: 'north', name: 'NORTE (N)', hint: 'Procure a letra N verde na bússola!' }, 
                    { id: 'south', name: 'SUL (S)', hint: 'O Sul (S) fica sempre oposto ao Norte (N).' }, 
                    { id: 'east', name: 'LESTE (L)', hint: 'No sentido horário, o Leste (L) vem logo após o Norte.' }, 
                    { id: 'west', name: 'OESTE (O)', hint: 'O Oeste (O) fica oposto ao Leste (L).' },
                    { id: 'ne', name: 'NORDESTE (NE)', hint: 'Fica exatamente entre o Norte (N) e o Leste (L).' }, 
                    { id: 'nw', name: 'NOROESTE (NO)', hint: 'Fica exatamente entre o Norte (N) e o Oeste (O).' },
                    { id: 'se', name: 'SUDESTE (SE)', hint: 'Fica exatamente entre o Sul (S) e o Leste (L).' }, 
                    { id: 'sw', name: 'SUDOESTE (SO)', hint: 'Fica exatamente entre o Sul (S) e o Oeste (O).' }
                ];
                const rotations = [0, 0, 90, 180, 270]; // Rotaciona a rosa dos ventos para desafiar a leitura real
                const randomRot = rotations[Math.floor(Math.random() * rotations.length)];
                setRoseAngle(randomRot);

                const target = points[Math.floor(Math.random() * points.length)];
                setInstruction(randomRot !== 0 ? `Mapa girado! Encontre o ${target.name}` : `Aponte para o ${target.name}`);
                setExpectedAnswer({ id: target.id, hint: target.hint });
            }, []);

            // --- MISSÃO 3: LABIRINTO SEQUENCIAL ---
            const [mazeStep, setMazeStep] = useState(0);
            const [playerRot, setPlayerRot] = useState(0);
            const [targetRot, setTargetRot] = useState(0);
            const [obstacleEmoji, setObstacleEmoji] = useState('⛰️');
            
            const startMission3 = () => {
                playSound('click');
                setMissionProgress(0); setMissionTotalSteps(5); setMissionComplete(false); setShields(3);
                generateMission3Task(); setCurrentScreen('mission3');
            };
            const generateMission3Task = useCallback(() => {
                const scenarios = [
                    { text: "Montanha bloqueando! Gire a nave para LESTE e avance.", rot: 90, obs: '⛰️' },
                    { text: "Tempestade no radar! Gire para SUL e avance.", rot: 180, obs: '⛈️' },
                    { text: "Abismo à frente! Gire para OESTE e avance.", rot: 270, obs: '🕳️' },
                    { text: "Rota limpa ao topo! Gire para NORTE e avance.", rot: 0, obs: '🚩' },
                    { text: "Ventos fortes! Gire para NORDESTE (45°) e avance.", rot: 45, obs: '🌪️' },
                    { text: "Recifes à vista! Gire para SUDOESTE (225°) e avance.", rot: 225, obs: '🪨' }
                ];
                const target = scenarios[Math.floor(Math.random() * scenarios.length)];
                setInstruction(target.text);
                setTargetRot(target.rot);
                setObstacleEmoji(target.obs);
                setMazeStep(0); 
            }, []);

            const handleMazeRotate = (dir) => {
                if(mazeStep === 1) return;
                playSound('click');
                // Agora gira de 45 em 45 graus para incluir colaterais!
                let newRot = playerRot + (dir === 'right' ? 45 : -45);
                if (newRot >= 360) newRot = 0; 
                if (newRot < 0) newRot = 315;
                setPlayerRot(newRot);
                
                if (newRot === targetRot) {
                    playSound('success');
                    setMazeStep(1); 
                    setInstruction('Rumo alinhado! Toque em AVANÇAR agora.');
                }
            };

            // --- MISSÃO 4: RADAR DE BÚSSOLA REAL + SIMULADOR MANUAL ---
            const startMission4 = () => {
                playSound('click');
                setMissionProgress(0); setMissionTotalSteps(4); setMissionComplete(false); setShields(3);
                generateMission4Task(); 
                setCurrentScreen('mission4');
                startRealSensors();
            };
            
            const generateMission4Task = useCallback(() => {
                const directions = [
                    { name: 'NORTE (0°)', angle: 0, item: 'Baú de Ouro' },
                    { name: 'NORDESTE (45°)', angle: 45, item: 'Relíquia Solar' },
                    { name: 'LESTE (90°)', angle: 90, item: 'Mapa Secreto' },
                    { name: 'SUDESTE (135°)', angle: 135, item: 'Esmeralda' },
                    { name: 'SUL (180°)', angle: 180, item: 'Artefato Antigo' },
                    { name: 'SUDOESTE (225°)', angle: 225, item: 'Luneta de Bronze' },
                    { name: 'OESTE (270°)', angle: 270, item: 'Cristal Raro' },
                    { name: 'NOROESTE (315°)', angle: 315, item: 'Coroa Perdida' }
                ];
                const target = directions[Math.floor(Math.random() * directions.length)];
                setTargetHeading(target.angle);
                setInstruction(`Sinal detectado! O ${target.item} está a ${target.name}. Alinhe o radar!`);
            }, []);

            // --- MISSÃO 5: HEMISFÉRIOS COMBINADOS (QUADRANTES GLOBAIS) ---
            const startMission5 = () => {
                playSound('click');
                setMissionProgress(0); setMissionTotalSteps(5); setMissionComplete(false); setShields(3);
                generateMission5Task(); setCurrentScreen('mission5');
            };
            const generateMission5Task = useCallback(() => {
                const latVal = Math.floor(Math.random() * 75) + 5;
                const lngVal = Math.floor(Math.random() * 165) + 5;
                const isNorth = Math.random() > 0.5;
                const isEast = Math.random() > 0.5;

                const latDir = isNorth ? 'N' : 'S';
                const lngDir = isEast ? 'L' : 'O';
                const quadKey = `${isNorth ? 'N' : 'S'}${isEast ? 'L' : 'O'}`;

                setInstruction(`Coordenada: ${latVal}° ${latDir}, ${lngVal}° ${lngDir}. Qual quadrante do globo?`);
                setExpectedAnswer({
                    key: quadKey,
                    hint: `${latDir === 'N' ? 'Norte' : 'Sul'} do Equador e ${lngDir === 'L' ? 'Leste' : 'Oeste'} de Greenwich.`
                });
            }, []);

            // --- CLASSES DE DESIGN ---
            const themeClasses = highContrast ? "bg-black text-white" : "bg-slate-100 text-slate-800";
            const appBgClasses = highContrast ? "bg-neutral-950 carto-grid-dark" : "bg-slate-50 carto-grid";
            const cardClasses = highContrast ? "bg-neutral-900 border-neutral-700 text-white" : "bg-white/95 border-slate-200/80 backdrop-blur-sm";
            const fontClass = dyslexicFont ? 'font-mono tracking-widest leading-relaxed' : 'font-sans tracking-normal';

            // --- COMPONENTES UI ---
            const renderTopBar = () => (
                <div className={`flex justify-between items-center px-4 py-3 shadow-sm z-20 shrink-0 ${highContrast ? 'bg-black border-b border-neutral-800' : 'bg-white border-b border-slate-100'}`}>
                    <div className="flex items-center gap-2">
                        <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-lg shadow-sm">
                            🧭
                        </div>
                        <div>
                            <span className="font-black text-base block leading-none">Bússola Digital</span>
                            <span className="text-[10px] font-bold uppercase tracking-wider opacity-60">Cartografia Inclusiva</span>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <div className="flex items-center gap-1.5 px-3 py-1 bg-amber-100 rounded-full border-2 border-amber-300 text-amber-800 shadow-xs">
                            <span className="text-sm">⭐</span>
                            <span className="font-black text-sm">{stars}</span>
                        </div>
                        <div className="px-2.5 py-1 rounded-full font-black text-xs border-2 bg-indigo-100 border-indigo-300 text-indigo-800">
                            Nv.{level}
                        </div>
                    </div>
                </div>
            );

            const renderMissionHeader = () => (
                <div className="px-4 pt-3 pb-1 shrink-0">
                    <div className="flex justify-between items-center mb-2">
                        <button onClick={goHome} className="px-3 py-1.5 rounded-xl bg-slate-200/70 text-slate-600 font-bold text-xs uppercase flex items-center gap-1 active:scale-95 transition-transform">
                            <span>◀</span> Mapa
                        </button>
                        <div className="flex items-center gap-1 bg-white/80 px-2.5 py-1 rounded-full border border-slate-200">
                            {[...Array(3)].map((_, i) => (
                                <span key={i} className={`text-base transition-all ${i < shields ? "scale-100" : "opacity-25 grayscale scale-75"}`}>🛡️</span>
                            ))}
                        </div>
                    </div>
                    <div className="w-full bg-slate-200/80 h-2.5 rounded-full overflow-hidden mb-3 shadow-inner">
                        <div className="h-full bg-gradient-to-r from-emerald-400 to-green-500 transition-all duration-500 rounded-full" style={{ width: `${(missionProgress / missionTotalSteps) * 100}%` }} />
                    </div>
                    <div className={`p-3.5 rounded-2xl shadow-sm border-2 flex items-center gap-3 w-full ${cardClasses}`}>
                        <button onClick={() => playSound('voice')} className="w-11 h-11 rounded-2xl bg-blue-600 text-white shrink-0 text-xl flex items-center justify-center shadow-md active:scale-90 transition-transform" aria-label="Ouvir instrução">
                            🔊
                        </button>
                        <h2 className="text-base sm:text-lg font-black leading-snug flex-1 text-left">{instruction}</h2>
                    </div>
                </div>
            );

            const renderBottomNav = () => (
                <div className={`flex justify-around items-center py-2.5 px-4 border-t shrink-0 ${highContrast ? 'bg-black border-neutral-800' : 'bg-white border-slate-200/80'} z-20`}>
                    <button onClick={() => { playSound('click'); setCurrentScreen('map'); setMissionComplete(false); }} className={`flex flex-col items-center py-1 px-4 rounded-xl transition-all active:scale-90 ${currentScreen === 'map' ? 'text-blue-600 bg-blue-50' : 'text-slate-400'}`}>
                        <span className="text-xl">🗺️</span><span className="text-[11px] font-extrabold uppercase mt-0.5">Missões</span>
                    </button>
                    <button onClick={() => { playSound('click'); setCurrentScreen('profile'); setMissionComplete(false); }} className={`flex flex-col items-center py-1 px-4 rounded-xl transition-all active:scale-90 ${currentScreen === 'profile' ? 'text-blue-600 bg-blue-50' : 'text-slate-400'}`}>
                        <span className="text-xl">🧑‍🚀</span><span className="text-[11px] font-extrabold uppercase mt-0.5">Perfil</span>
                    </button>
                    <button onClick={() => { playSound('click'); setShowSettings(true); }} className="flex flex-col items-center py-1 px-4 rounded-xl text-slate-400 transition-all active:scale-90">
                        <span className="text-xl">⚙️</span><span className="text-[11px] font-extrabold uppercase mt-0.5">Ajustes</span>
                    </button>
                </div>
            );

            const renderSettingsModal = () => {
                if (!showSettings) return null;
                return (
                    <div className="absolute inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-4">
                        <div className={`w-full max-w-sm rounded-3xl p-6 shadow-2xl border-2 ${cardClasses}`}>
                            <div className="flex justify-between items-center mb-5">

                                    <button onClick={() => { playSound('click'); !feedback && triggerFeedback(expectedAnswer.key === 'SL', `Dica: ${expectedAnswer.hint}`, generateMission5Task); }} className="bg-rose-100 active:bg-rose-200 border-b-4 border-rose-400 rounded-3xl flex flex-col items-center justify-center p-3 transition-transform active:translate-y-0.5">
                                        <span className="text-3xl mb-1">🌎↘️</span>
                                        <span className="font-black text-rose-900 text-base text-center leading-tight">Sul<br/>& Leste</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* FEEDBACK OVERLAYS */}
                        {feedback && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center px-5 bg-black/40 backdrop-blur-xs">
                                <div className={`p-6 rounded-3xl shadow-2xl flex flex-col items-center text-center w-full max-w-xs border-4 ${feedback.type === 'success' ? 'bg-emerald-50 border-emerald-400' : 'bg-rose-50 border-rose-400'}`}>
                                    {feedback.type === 'success' ? (
                                        <><span className="text-5xl mb-2 animate-bounce">✅</span><h2 className="text-2xl font-black text-emerald-800">Correto!</h2><p className="font-bold text-emerald-700 text-sm mt-1">{feedback.message}</p></>
                                    ) : (
                                        <><span className="text-5xl mb-2">⚠️</span><h2 className="text-xl font-black text-rose-800">Atenção!</h2><p className="text-rose-700 font-bold text-sm mt-2 leading-snug">{feedback.message}</p></>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* TELA DE CONCLUSÃO */}
                        {missionComplete && (
                            <div className="absolute inset-0 z-40 bg-white flex flex-col items-center justify-center p-6 text-center">
                                <span className="text-7xl mb-3 animate-bounce">🏆</span>
                                <h1 className="text-3xl font-black text-slate-800">Missão Concluída!</h1>
                                <p className="font-bold text-slate-500 text-base mt-1 mb-6">Escudos restantes: {shields} (+{shields * 15} XP bônus)</p>
                                <button onClick={goHome} className="w-full max-w-xs py-4 bg-blue-600 active:bg-blue-700 border-b-4 border-blue-800 text-white rounded-2xl font-black text-lg shadow-lg">Voltar ao Mapa</button>
                            </div>
                        )}

                        {/* MENU INFERIOR */}
                        {(currentScreen === 'map' || currentScreen === 'profile') && renderBottomNav()}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
